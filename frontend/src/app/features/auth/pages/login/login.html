<div class="flex min-h-dvh items-center justify-center bg-gray-50 px-4">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="w-full max-w-sm space-y-4 rounded-lg border border-gray-200 bg-white p-6 shadow-sm"
  >
    <h1 class="text-xl font-semibold text-gray-900">Log in</h1>

    <div class="space-y-1">
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
      />
    </div>

    <div class="space-y-1">
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
      />
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="w-full rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
</div>
